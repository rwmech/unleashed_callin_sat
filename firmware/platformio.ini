; ===========================================================================
;  µnleashed gateway sat: the firmware
; ===========================================================================
;
; File:         firmware/platformio.ini
; Module:       Build / PlatformIO project
;
; Purpose:      A gateway sat: a cheap ESP32 that brings callers in to a
;               µnleashed board. Three roles, all of them runtime settings
;               and none of them a build flag: an access point with a
;               portal, a terminal server on a serial port, and (from a
;               later phase) a repeater.
;
;               Build:   pio run
;               Flash:   pio run -t upload --upload-port COMn
;               Console: pio device monitor --port COMn
;
;               tools/fetch_web.py runs first and fetches the browser
;               terminal's third-party assets at the version web/xterm.lock
;               pins, into the gitignored .web-cache/; tools/mkweb.py then
;               gzips every page into a header the app image carries.
;
; Targets:      A base ESP32 (WROOM-32E, 4 MB, no PSRAM) is the floor, and
;               the WROVER is the hedge if phase 2 finds internal RAM tight.
