[platformio]
default_envs = gateway

[common]
platform                = espressif32@6.9.0   ; ESP-IDF 5.3.1, the core's version
framework               = espidf
board_upload.flash_size = 4MB
board_build.partitions  = partitions.csv
upload_speed            = 921600
monitor_speed           = 115200
monitor_filters         = esp32_exception_decoder
extra_scripts           = pre:tools/fetch_web.py

; ---------------------------------------------------------------------------
;  The reference board: a bare ESP32-WROOM-32E dev kit, 4 MB, no PSRAM.
;  Everything is sized against this one.
; ---------------------------------------------------------------------------
[env:gateway]
extends      = common
board        = esp32dev
build_flags  = -DGW_BOARD_WROOM32

; The same thing, built as it ships: a build whose browser terminal is the
; placeholder (no network at build time) is refused rather than flashed.
[env:gateway_release]
extends      = env:gateway
build_flags  = ${env:gateway.build_flags} -DGW_RELEASE

; ---------------------------------------------------------------------------
;  The hedge: an ESP32-WROVER, same price class, PSRAM for the buffers.
;  Its own sdkconfig layer, named here rather than left as
;  sdkconfig.defaults.esp32, which would reach the WROOM too (the core's
;  own lesson from the Freenove profile).
; ---------------------------------------------------------------------------
[env:gateway_wrover]
extends     = common
board       = esp32dev
build_flags = -DGW_BOARD_WROVER
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.wrover"

[env:gateway_wrover_release]
extends     = env:gateway_wrover
build_flags = ${env:gateway_wrover.build_flags} -DGW_RELEASE
board_build.cmake_extra_args = ${env:gateway_wrover.board_build.cmake_extra_args}
